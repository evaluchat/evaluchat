# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Triage policy: authentication, authorization, and attacker-controlled input
# hold the merge. Everything else is tracked as board debt, not fixed inline.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  pre_merge_checks:
    docstrings:
      mode: off
    issue_assessment:
      mode: off
