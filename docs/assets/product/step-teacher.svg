<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Teacher review of prompts">
  <defs>
    <linearGradient id="bg3" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef6"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg3)"/>
  <rect x="24" y="22" width="672" height="376" rx="14" fill="#fff" stroke="#dde3eb"/>
  <rect x="24" y="22" width="672" height="44" fill="#2c3e56"/>
  <text x="44" y="50" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#fff">Teacher review</text>
  <text x="560" y="50" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,.75)">Submitted</text>
  <rect x="40" y="84" width="300" height="296" rx="10" fill="#fafbfc" stroke="#e3e8ef"/>
  <text x="56" y="110" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#5c6675">DIALOGUE</text>
  <rect x="56" y="126" width="268" height="44" rx="8" fill="#eef3f9"/>
  <text x="68" y="152" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#2c3e56">Student: My claim is that...</text>
  <rect x="56" y="182" width="268" height="56" rx="8" fill="#2c3e56"/>
  <text x="68" y="206" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#fff">Coach: Which counter-argument</text>
  <text x="68" y="224" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="rgba(255,255,255,.8)">worries you most?</text>
  <rect x="56" y="250" width="268" height="44" rx="8" fill="#eef3f9"/>
  <text x="68" y="276" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#2c3e56">Student: Sample bias in detectors</text>
  <text x="56" y="340" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#8a93a1">Prompts = language evidence</text>
  <rect x="356" y="84" width="320" height="180" rx="10" fill="#fff" stroke="#e3e8ef"/>
  <text x="372" y="110" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#5c6675">FINAL CANVAS</text>
  <text x="372" y="140" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#2c3e56">AI detectors misclassify L2 writers...</text>
  <text x="372" y="164" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#5c6675">Revision visible across versions</text>
  <text x="372" y="186" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#5c6675">Teacher reads process + product</text>
  <rect x="356" y="280" width="98" height="70" rx="10" fill="#eef3f9"/>
  <text x="370" y="308" font-family="Inter,Segoe UI,sans-serif" font-size="10" fill="#5c6675">Sessions</text>
  <text x="370" y="332" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2c3e56">4</text>
  <rect x="466" y="280" width="98" height="70" rx="10" fill="#eef3f9"/>
  <text x="480" y="308" font-family="Inter,Segoe UI,sans-serif" font-size="10" fill="#5c6675">Keystrokes</text>
  <text x="480" y="332" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2c3e56">1.2k</text>
  <rect x="576" y="280" width="100" height="70" rx="10" fill="#eef3f9"/>
  <text x="590" y="308" font-family="Inter,Segoe UI,sans-serif" font-size="10" fill="#5c6675">Paste ratio</text>
  <text x="590" y="332" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#2c3e56">8%</text>
</svg>
