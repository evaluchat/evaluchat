<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Evaluchat chat panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)"/>
  <rect x="28" y="24" width="664" height="372" rx="14" fill="#fff" stroke="#dde3eb"/>
  <rect x="28" y="24" width="664" height="48" rx="14" fill="#2c3e56"/>
  <rect x="28" y="48" width="664" height="24" fill="#2c3e56"/>
  <circle cx="56" cy="48" r="10" fill="#fff" opacity=".9"/>
  <text x="76" y="53" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#fff">Assignment chat</text>
  <text x="620" y="53" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,.7)">Teaching</text>
  <rect x="52" y="92" width="420" height="58" rx="12" fill="#eef3f9"/>
  <text x="70" y="116" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#2c3e56">What claim am I trying to defend in this essay?</text>
  <text x="70" y="136" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#5c6675">I think AI detectors misread L2 writers...</text>
  <rect x="200" y="168" width="460" height="78" rx="12" fill="#2c3e56"/>
  <text x="220" y="194" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#fff">Good - say that in your own words first.</text>
  <text x="220" y="216" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="rgba(255,255,255,.82)">What evidence would convince a sceptical reader?</text>
  <text x="220" y="234" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="rgba(255,255,255,.82)">Draft one sentence of your thesis here in chat.</text>
  <rect x="52" y="266" width="380" height="46" rx="12" fill="#eef3f9"/>
  <text x="70" y="294" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#2c3e56">Detectors punish fluency patterns that L2 writers...</text>
  <rect x="52" y="340" width="560" height="36" rx="10" fill="#f7f9fc" stroke="#dde3eb"/>
  <text x="68" y="363" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#8a93a1">Message your coach...</text>
  <circle cx="640" cy="358" r="14" fill="#2c3e56"/>
  <path d="M634 358h10M640 352v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
