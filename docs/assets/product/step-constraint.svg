<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Evaluchat constrained canvas">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg2)"/>
  <rect x="24" y="22" width="672" height="376" rx="14" fill="#fff" stroke="#dde3eb"/>
  <rect x="24" y="22" width="672" height="44" fill="#2c3e56"/>
  <text x="44" y="50" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#fff">Evaluchat</text>
  <rect x="520" y="34" width="150" height="20" rx="10" fill="rgba(255,255,255,.15)"/>
  <text x="545" y="48" font-family="Inter,Segoe UI,sans-serif" font-size="10" fill="#fff">Draft locked until contribution</text>
  <rect x="36" y="78" width="250" height="304" rx="10" fill="#fafbfc" stroke="#e3e8ef"/>
  <text x="52" y="104" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#5c6675">CHAT</text>
  <rect x="52" y="118" width="218" height="36" rx="8" fill="#eef3f9"/>
  <text x="62" y="140" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#2c3e56">Write my whole essay please</text>
  <rect x="52" y="166" width="218" height="52" rx="8" fill="#2c3e56"/>
  <text x="62" y="188" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#fff">I cannot draft the full essay yet.</text>
  <text x="62" y="206" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="rgba(255,255,255,.8)">Share your outline first.</text>
  <rect x="52" y="232" width="218" height="36" rx="8" fill="#eef3f9"/>
  <text x="62" y="254" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#2c3e56">Ok - thesis + 3 reasons...</text>
  <rect x="300" y="78" width="380" height="304" rx="10" fill="#fff" stroke="#e3e8ef"/>
  <text x="316" y="104" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#5c6675">CANVAS</text>
  <rect x="316" y="118" width="348" height="140" rx="8" fill="#f4f7fb" stroke="#d5dde8" stroke-dasharray="5 4"/>
  <text x="336" y="168" font-family="Inter,Segoe UI,sans-serif" font-size="13" fill="#5c6675">Scaffolding unlocks after dialogic effort</text>
  <text x="336" y="190" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#8a93a1">No finished essay from one throwaway prompt</text>
  <rect x="316" y="278" width="160" height="28" rx="8" fill="#2c3e56"/>
  <text x="340" y="296" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#fff">Contribution gate</text>
  <rect x="488" y="278" width="176" height="28" rx="8" fill="#e8eef6"/>
  <text x="510" y="296" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#2c3e56">Proportional unlock</text>
</svg>
